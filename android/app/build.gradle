plugins {
    id 'com.android.application'
}

// Assinatura própria: usa android/keystore.properties se existir,
// senão cai para a chave debug (instalável, mas sem identidade própria).
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.thomsongs.app'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
    }

    // Dois apps independentes no mesmo projeto — cada um com seu
    // applicationId, então o Android os trata como apps diferentes:
    // instalar/atualizar um NUNCA modifica o outro.
    //   thom → Thom Songs (música) · com.thomsongs.app
    //   oa   → OA Sens HUD (Onmyoji Arena) · com.oasens.app
    flavorDimensions "app"
    productFlavors {
        thom {
            dimension "app"
            applicationId "com.thomsongs.app"
            versionCode 27
            versionName "1.22.0"
            resValue "string", "app_name", "Thom Songs"
            resValue "string", "download_dir", "Thom Songs"
            resValue "string", "prefs_name", "thomupd"
        }
        oa {
            dimension "app"
            applicationId "com.oasens.app"
            versionCode 1
            versionName "1.0.0"
            resValue "string", "app_name", "OA Sens HUD"
            resValue "string", "download_dir", "OA Sens HUD"
            resValue "string", "prefs_name", "oaupd"
        }
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
