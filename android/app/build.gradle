plugins {
    id 'com.android.application'
}

// Assinatura própria obrigatória: o build RELEASE aborta sem keystore
// (nunca mais publicar APK com chave debug por engano).
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) {
    ksFile.withInputStream { ksProps.load(it) }
}

android {
    namespace 'com.thomsongs.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.thomsongs.app'
        minSdk 24
        targetSdk 34
        versionCode 39
        versionName '1.27.0'
    }

    signingConfigs {
        release {
            storeFile rootProject.file(ksProps['storeFile'] ?: 'thomsongs-release.keystore')
            storePassword ksProps['storePassword'] ?: ''
            keyAlias ksProps['keyAlias'] ?: 'thomsongs'
            keyPassword ksProps['keyPassword'] ?: ''
            enableV1Signing = true
            enableV2Signing = true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
